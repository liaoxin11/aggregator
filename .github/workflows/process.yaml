name: Process
on:
  schedule:
    - cron: "15 */6 * * *"   # every 6 hours
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  GIST_PAT: ${{ secrets.GIST_PAT }}
  GIST_LINK: ${{ secrets.GIST_LINK }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  WORKFLOW_MODE: "1"
  ENABLE_SPECIAL_PROTOCOLS: ${{ vars.ENABLE_SPECIAL_PROTOCOLS }}

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: "x64"
          cache: "pip"

      - name: Install
        run: pip3 install -r requirements.txt

      - name: Process
        # process.py runs the crawl module:
        #   - GitHub code search (/api/v1/client/subscribe?token=)
        #   - GitHub issues search
        #   - repo commits tracking
        # finds new subscription URLs, persists to Gist, then aggregates
        run: python -u subscribe/process.py --overwrite

      - name: Timestamp
        run: date
