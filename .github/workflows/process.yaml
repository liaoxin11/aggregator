name: Process
on:
  schedule:
    - cron: "15 */6 * * *"   # every 6 hours
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  GIST_PAT: ${{ secrets.GIST_PAT }}
  GIST_LINK: ${{ secrets.GIST_LINK }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  PUSH_TOKEN: ${{ secrets.GIST_PAT }}
  SUBSCRIBE_CONF: ${{ secrets.SUBSCRIBE_CONF }}
  WORKFLOW_MODE: "1"

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: "x64"
          cache: "pip"

      - name: Install
        run: pip3 install -r requirements.txt

      - name: Process
        # process.py reads config from SUBSCRIBE_CONF (gist URL)
        # config.json enables: github code search crawl (5 pages) + gist storage
        # discovers new /api/v1/client/subscribe?token= links, persists to crawledsubs
        run: python -u subscribe/process.py --overwrite

      - name: Timestamp
        run: date
