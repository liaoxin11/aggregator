name: Collect
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  GIST_PAT: ${{ secrets.GIST_PAT }}
  GIST_LINK: ${{ secrets.GIST_LINK }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  ENABLE_SPECIAL_PROTOCOLS: ${{ vars.ENABLE_SPECIAL_PROTOCOLS }}

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GIST_PAT }}

      - name: Prepare
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: "x64"
          cache: "pip"

      - name: Install
        run: pip3 install -r requirements.txt

      - name: Merge crawled subs
        env:
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GIST_LINK: ${{ secrets.GIST_LINK }}
        run: |
          GIST_ID_ONLY=$(echo "$GIST_LINK" | cut -d/ -f2)
          CRAWLED=$(curl -sL -H "Authorization: token $GIST_PAT" \
            "https://api.github.com/gists/$GIST_ID_ONLY" \
            | python3 -c "
          import json,sys,urllib.request
          try:
            d=json.load(sys.stdin)
            raw=d.get('files',{}).get('crawledsubs.txt',{}).get('raw_url','')
            if not raw: sys.exit()
            c=urllib.request.urlopen(raw,timeout=15).read().decode('utf8','ignore')
            data=json.loads(c) if c.strip() else {}
            for url in data.keys(): print(url)
          except: pass
          ")
          if [ -n "$CRAWLED" ]; then
            mkdir -p data
            { cat data/subscribes.txt 2>/dev/null; echo "$CRAWLED"; } | grep -E '^https?://' | sort -u > /tmp/all_candidates.txt
            cp /tmp/all_candidates.txt data/subscribes.txt
            echo "Merged crawledsubs → $(wc -l < data/subscribes.txt) total sources"
          else
            cp data/subscribes.txt /tmp/all_candidates.txt 2>/dev/null || touch /tmp/all_candidates.txt
            echo "No crawledsubs to merge"
          fi

      - name: Pre-validate sources
        # Loosely validate: HTTP 200 + content > 32 bytes.
        # Only keep reachable sources so collect.py's check_status passes them all.
        run: |
          python3 -c "
          import urllib.request, ssl, concurrent.futures, re, sys
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          with open('/tmp/all_candidates.txt') as f:
              urls = [l.strip() for l in f if l.strip().startswith('http')]
          print(f'validating {len(urls)} sources...', file=sys.stderr)

          def check(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'clash.meta'})
                  resp = urllib.request.urlopen(req, timeout=15, context=ctx)
                  if resp.getcode() != 200:
                      return None
                  content = resp.read(1024*1024).decode('utf8', 'ignore')
                  if len(content) < 32:
                      return None
                  # check if content looks like proxies
                  has_proxy = bool(re.search(r'(vmess://|vless://|trojan://|ss://|ssr://|hy2://|hysteria2://|tuic://|\"server\"|proxies:|server:|\"type\"|shadowsocks|\"outbounds\")', content))
                  if has_proxy:
                      return url
                  # might be base64 encoded
                  if len(content) > 100 and re.match(r'^[A-Za-z0-9+/=\s]+$', content[:500]):
                      return url
                  return None
              except:
                  return None

          with concurrent.futures.ThreadPoolExecutor(max_workers=50) as ex:
              results = list(ex.map(check, urls))

          valid = [u for u in results if u]
          print(f'valid: {len(valid)} / {len(urls)}', file=sys.stderr)
          with open('data/subscribes.txt', 'w') as f:
              for u in valid:
                  f.write(u + '\n')
          print(f'wrote {len(valid)} valid sources to data/subscribes.txt')
          "

      - name: Collect
        run: python -u subscribe/collect.py --all --refresh --skip

      - name: Commit and push data
        run: |
          git config --local user.email 'liaoxin11@users.noreply.github.com'
          git config --local user.name 'liaoxin11'
          git add ./data/* || true
          git commit -m "$(date '+%Y-%m-%d %H:%M:%S') sub_merge_node" || true
          git push

      - name: Timestamp
        run: date
