name: Collect
on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  GIST_PAT: ${{ secrets.GIST_PAT }}
  GIST_LINK: ${{ secrets.GIST_LINK }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  ENABLE_SPECIAL_PROTOCOLS: ${{ vars.ENABLE_SPECIAL_PROTOCOLS }}

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: "x64"
          cache: "pip"

      - name: Install
        run: pip3 install -r requirements.txt

      - name: Check
        run: |
          if [ -z "$GIST_PAT" ]; then echo "Error: GIST_PAT empty"; exit 1; fi
          if [ -z "$GIST_LINK" ]; then echo "Error: GIST_LINK empty"; exit 1; fi

      - name: Collect
        # refresh = skip airport registration, use existing subscriptions only
        # skip = skip clash liveness check (Resin does probing)
        # all = generate all format outputs (clash/v2ray/singbox)
        run: python -u subscribe/collect.py --all --refresh --skip

      - name: Timestamp
        run: date
